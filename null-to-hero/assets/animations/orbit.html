<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit loader</title>
<style>
  :root { --orbit: #6a5cff; --core: #b7aeff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .orbit { position: relative; width: 56px; height: 56px; }
  .core { position: absolute; inset: 50%; width: 12px; height: 12px; margin: -6px; border-radius: 50%; background: var(--core); }
  .path { position: absolute; inset: 0; }
  .dot { position: absolute; top: -3px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--orbit); }
  @media (prefers-reduced-motion: no-preference) {
    .path { animation: nth-spin 1.2s linear infinite; }
  }
  @keyframes nth-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="orbit" role="status" aria-label="Loading">
    <div class="core"></div>
    <div class="path"><div class="dot"></div></div>
  </div>
</body>
</html>
