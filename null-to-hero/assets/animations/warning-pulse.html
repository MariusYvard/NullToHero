<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warning pulse</title>
<style>
  :root { --warn: #f5a623; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .warn { position: relative; width: 54px; height: 54px; display: grid; place-items: center; }
  .warn .glyph { width: 44px; height: 44px; border-radius: 50%; background: var(--warn);
    color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 700; line-height: 1; z-index: 1; }
  .warn .halo { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--warn); }
  @media (prefers-reduced-motion: no-preference) {
    .warn .halo { animation: nth-halo 1.4s ease-out infinite; }
  }
  @media (prefers-reduced-motion: reduce) { .warn .halo { opacity: 0.3; } }
  @keyframes nth-halo {
    0% { transform: scale(0.85); opacity: 0.8; }
    100% { transform: scale(1.4); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="warn" role="img" aria-label="Warning">
    <div class="halo"></div>
    <div class="glyph">!</div>
  </div>
</body>
</html>
