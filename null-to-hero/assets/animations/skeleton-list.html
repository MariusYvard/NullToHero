<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton list</title>
<style>
  :root { --base: #e4e8f0; --hi: #f2f4f8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ffffff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .list { width: 300px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .sk { background: var(--base); border-radius: 6px; }
  .av { width: 44px; height: 44px; border-radius: 50%; flex: none; }
  .lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .l1 { height: 12px; width: 70%; }
  .l2 { height: 10px; width: 45%; }
  @media (prefers-reduced-motion: no-preference) {
    .sk { background: linear-gradient(90deg, var(--base) 25%, var(--hi) 37%, var(--base) 63%);
      background-size: 400% 100%; animation: nth-shimmer 1.4s ease-in-out infinite; }
  }
  @keyframes nth-shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
</style>
</head>
<body>
  <div class="list" role="status" aria-label="Loading content">
    <div class="row"><div class="sk av"></div><div class="lines"><div class="sk l1"></div><div class="sk l2"></div></div></div>
    <div class="row"><div class="sk av"></div><div class="lines"><div class="sk l1"></div><div class="sk l2"></div></div></div>
    <div class="row"><div class="sk av"></div><div class="lines"><div class="sk l1"></div><div class="sk l2"></div></div></div>
  </div>
</body>
</html>
