<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing indicator</title>
<style>
  :root { --dot: #8a8f9e; --bubble: #eceef3; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .bubble { display: inline-flex; gap: 6px; align-items: center; padding: 14px 18px;
    background: var(--bubble); border-radius: 18px 18px 18px 4px; }
  .bubble span { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
  @media (prefers-reduced-motion: no-preference) {
    .bubble span { animation: nth-type 1.2s ease-in-out infinite; }
    .bubble span:nth-child(2) { animation-delay: 0.2s; }
    .bubble span:nth-child(3) { animation-delay: 0.4s; }
  }
  @keyframes nth-type {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="bubble" role="status" aria-label="Typing"><span></span><span></span><span></span></div>
</body>
</html>
