<!doctype html>
<meta charset="utf-8">
<title>reduced-motion fixture, honoured</title>
<style>
  @keyframes drift { from { transform: translateX(0) } to { transform: translateX(40px) } }
  @keyframes scroll { from { transform: translateX(0) } to { transform: translateX(-50%) } }
  .badge { animation: drift 2s ease-in-out infinite alternate; }
  .marquee { animation: scroll 20s linear infinite; }
</style>
<div class="badge">new</div>
<div class="marquee">shipping worldwide · shipping worldwide</div>
<script>
  // Keep a running animation witness while freezing its clock. The previous 1ms
  // duration could finish before the probe sampled under full-suite load.
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (const animation of document.getAnimations()) animation.updatePlaybackRate(0);
  }
</script>
