<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equalizer bars</title>
<style>
  :root { --bar: #6a5cff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .eq { display: flex; align-items: flex-end; gap: 5px; height: 44px; }
  .eq span { width: 7px; height: 100%; border-radius: 3px; background: var(--bar); transform-origin: bottom; }
  @media (prefers-reduced-motion: no-preference) {
    .eq span { animation: nth-eq 1s ease-in-out infinite; }
    .eq span:nth-child(2) { animation-delay: 0.15s; }
    .eq span:nth-child(3) { animation-delay: 0.3s; }
    .eq span:nth-child(4) { animation-delay: 0.45s; }
    .eq span:nth-child(5) { animation-delay: 0.6s; }
  }
  @media (prefers-reduced-motion: reduce) {
    .eq span:nth-child(1) { transform: scaleY(0.4); }
    .eq span:nth-child(2) { transform: scaleY(0.8); }
    .eq span:nth-child(3) { transform: scaleY(0.5); }
    .eq span:nth-child(4) { transform: scaleY(0.9); }
    .eq span:nth-child(5) { transform: scaleY(0.6); }
  }
  @keyframes nth-eq { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
</style>
</head>
<body>
  <div class="eq" role="status" aria-label="Loading"><span></span><span></span><span></span><span></span><span></span></div>
</body>
</html>
