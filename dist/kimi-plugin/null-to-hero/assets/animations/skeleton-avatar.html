<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton avatar card</title>
<style>
  :root { --base: #e4e8f0; --hi: #f2f4f8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ffffff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .card { width: 200px; display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 24px; border: 1px solid #eef1f6; border-radius: 12px; }
  .sk { background: var(--base); border-radius: 6px; }
  .av { width: 72px; height: 72px; border-radius: 50%; }
  .name { height: 14px; width: 60%; }
  .sub { height: 11px; width: 40%; }
  @media (prefers-reduced-motion: no-preference) {
    .sk { background: linear-gradient(90deg, var(--base) 25%, var(--hi) 37%, var(--base) 63%);
      background-size: 400% 100%; animation: nth-shimmer 1.4s ease-in-out infinite; }
  }
  @keyframes nth-shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
</style>
</head>
<body>
  <div class="card" role="status" aria-label="Loading profile">
    <div class="sk av"></div>
    <div class="sk name"></div>
    <div class="sk sub"></div>
  </div>
</body>
</html>
