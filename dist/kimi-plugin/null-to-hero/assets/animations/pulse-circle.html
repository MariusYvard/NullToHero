<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse circle</title>
<style>
  :root { --pulse: #6a5cff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .pulse { width: 44px; height: 44px; border-radius: 50%; background: var(--pulse); }
  @media (prefers-reduced-motion: no-preference) {
    .pulse { animation: nth-pulse 1.2s ease-in-out infinite; }
  }
  @keyframes nth-pulse {
    0%, 100% { transform: scale(0.6); opacity: 0.5; }
    50% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="pulse" role="status" aria-label="Loading"></div>
</body>
</html>
