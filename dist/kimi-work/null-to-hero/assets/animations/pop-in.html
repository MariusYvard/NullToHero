<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pop in</title>
<style>
  :root { --badge: #6a5cff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .pop { width: 60px; height: 60px; border-radius: 16px; background: var(--badge);
    display: grid; place-items: center; color: #fff; }
  .pop svg { width: 30px; height: 30px; }
  @media (prefers-reduced-motion: no-preference) {
    .pop { animation: nth-pop 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
  }
  @keyframes nth-pop {
    0% { transform: scale(0); opacity: 0; }
    25% { transform: scale(1); opacity: 1; }
    75% { transform: scale(1); opacity: 1; }
    90% { transform: scale(0); opacity: 0; }
    100% { transform: scale(0); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="pop" role="img" aria-label="Item added">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20,6 9,17 4,12"/>
    </svg>
  </div>
</body>
</html>
