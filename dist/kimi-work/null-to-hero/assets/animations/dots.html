<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouncing dots</title>
<style>
  :root { --dot: #6a5cff; --dot-size: 14px; --gap: 10px; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #f4f6fb;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  .dots { display: inline-flex; gap: var(--gap); }
  .dots span {
    width: var(--dot-size); height: var(--dot-size);
    border-radius: 50%; background: var(--dot);
  }
  @media (prefers-reduced-motion: no-preference) {
    .dots span { animation: nth-bounce 1.2s ease-in-out infinite; }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
  }
  @keyframes nth-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.55; }
    30% { transform: translateY(-14px); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="dots" role="status" aria-label="Loading">
    <span></span><span></span><span></span>
  </div>
</body>
</html>
