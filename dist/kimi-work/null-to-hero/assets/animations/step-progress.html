<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step progress</title>
<style>
  :root { --done: #6a5cff; --idle: #dbe1ee; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .steps { display: flex; align-items: center; }
  .node { width: 22px; height: 22px; border-radius: 50%; background: var(--idle); flex: none; }
  .node.done { background: var(--done); }
  .link { width: 56px; height: 4px; background: var(--idle); position: relative; overflow: hidden; }
  .link .fill { position: absolute; inset: 0; background: var(--done); width: 100%; transform-origin: left; }
  .link.pending .fill { width: 100%; }
  @media (prefers-reduced-motion: no-preference) {
    .link.pending .fill { transform: scaleX(0); animation: nth-grow 1.2s ease-out forwards; }
  }
  @keyframes nth-grow { to { transform: scaleX(1); } }
</style>
</head>
<body>
  <div class="steps" role="progressbar" aria-label="Step 3 of 4">
    <div class="node done"></div>
    <div class="link"><div class="fill"></div></div>
    <div class="node done"></div>
    <div class="link"><div class="fill"></div></div>
    <div class="node done"></div>
    <div class="link pending"><div class="fill"></div></div>
    <div class="node"></div>
  </div>
</body>
</html>
