<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Like burst</title>
<style>
  :root { --heart: #e5484d; --spark: #f5a623; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .burst { position: relative; width: 80px; height: 80px; display: grid; place-items: center; }
  .heart { width: 40px; height: 40px; color: var(--heart); z-index: 2; }
  .spark { position: absolute; top: 50%; left: 50%; width: 7px; height: 7px; border-radius: 50%;
    background: var(--spark); margin: -3.5px; }
  .s1 { --tx: 0px; --ty: -30px; } .s2 { --tx: 26px; --ty: -16px; }
  .s3 { --tx: 26px; --ty: 16px; } .s4 { --tx: 0px; --ty: 30px; }
  .s5 { --tx: -26px; --ty: 16px; } .s6 { --tx: -26px; --ty: -16px; }
  @media (prefers-reduced-motion: no-preference) {
    .heart { animation: nth-pop 1.6s ease-in-out infinite; }
    .spark { animation: nth-spark 1.6s ease-out infinite; }
  }
  @media (prefers-reduced-motion: reduce) { .spark { display: none; } }
  @keyframes nth-pop {
    0%, 55%, 100% { transform: scale(1); }
    15% { transform: scale(0.7); }
    30% { transform: scale(1.25); }
    40% { transform: scale(1); }
  }
  @keyframes nth-spark {
    0%, 25% { transform: translate(0, 0) scale(0); opacity: 0; }
    35% { opacity: 1; }
    55% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="burst" role="img" aria-label="Liked">
    <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
    <span class="spark s4"></span><span class="spark s5"></span><span class="spark s6"></span>
    <svg class="heart" viewBox="0 0 32 32" fill="currentColor">
      <path d="M16 28 C16 28 3 20 3 11 A6.5 6.5 0 0 1 16 8 A6.5 6.5 0 0 1 29 11 C29 20 16 28 16 28 Z"/>
    </svg>
  </div>
</body>
</html>
