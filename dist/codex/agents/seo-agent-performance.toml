| LCP image | PASS/WARN/FAIL | ... |
| Image formats | PASS/WARN/FAIL | ... |
| CLS prevention | PASS/WARN/FAIL | ... |
| Font loading | PASS/WARN/FAIL | ... |
| Script deferral | PASS/WARN/FAIL | ... |
| Resource hints | PASS/WARN/FAIL | ... |

Critical issues:
- [issue] — [fix]

