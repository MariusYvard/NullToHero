<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scroll animation guarded in JS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A clear meta description of a sensible length, used by the eval fixtures to validate checks end to end.">
<style>@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }</style>
</head>
<body style="background:#ffffff">
<h1>Primary heading</h1>
<p style="color:#222222;background:#ffffff">Readable text.</p>
<div class="hero">Hero</div>
</body>
</html>
