<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hidden document scrollbar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A clear meta description of a sensible length, used by the eval fixtures to validate checks end to end.">
<style>html { scrollbar-width: none; } ::-webkit-scrollbar { display: none; }</style>
</head>
<body style="background:#ffffff">
<h1>Primary heading</h1>
<p style="color:#222222;background:#ffffff">Readable text.</p>
</body>
</html>
