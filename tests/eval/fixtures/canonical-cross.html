<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cross-domain canonical fixture</title>
  <meta name="description" content="A production-host page whose canonical points at a different domain, which is a soft warning rather than a hard failure.">
  <link rel="canonical" href="https://another-domain.example/page">
</head>
<body>
  <h1>Cross-domain canonical</h1>
  <p>This page canonicalises to a different domain, which the checker warns about.</p>
</body>
</html>
