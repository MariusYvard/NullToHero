<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token contrast passing fixture</title>
  <meta name="description" content="A fixture whose body text uses accessible design tokens so the static contrast pass resolves them from CSS and passes.">
  <style>
    :root { --paper:#ffffff; --ink:#1a1a1a; --muted:#4a4a4a; }
    body { background: var(--paper); color: var(--ink); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <h1>Heading in ink</h1>
  <p class="muted">This muted paragraph uses an accessible token colour on white.</p>
  <p>Body copy in ink that passes.</p>
</body>
</html>
