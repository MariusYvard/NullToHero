name: audit-selftest

# Continuous deterministic audit: grades the analyzer against the labeled
# fixtures and proves the CI gate passes a clean page and fails a defective one.
# This is the deterministic half of /audit running on every push.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: audit-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Analyzer eval (correctness + drift)
        run: node null-to-hero/tools/audit/eval.mjs --strict

      # 85 et non 90 depuis le 24 août 2026. Cette fixture est propre pour les
      # dix-huit contrôles curés (0 échec, 1 avertissement) mais déclenche une
      # règle du moteur, rule-11 : son image de tête n'a ni avif ni webp. Depuis
      # que les règles sont notées à 4 points l'échec, elle vaut 89 et non 93.
      # Le constat est vrai, donc la fixture n'est pas retouchée et c'est le
      # seuil qui laisse passer une page à un constat fin près.
      - name: Gate passes a clean fixture
        run: node null-to-hero/tools/audit/gate.mjs tests/eval/fixtures/clean-pass.html --min-score 85

      - name: Gate fails a defective fixture (below score threshold)
        run: |
          if node null-to-hero/tools/audit/gate.mjs tests/eval/fixtures/contrast-fail-grey.html --min-score 90; then
            echo "::error::gate should have failed the low-scoring defective fixture"
            exit 1
          fi
          echo "gate correctly failed the defective fixture on the score threshold"

      - name: Gate blocks a critical defect (robots)
        run: |
          if node null-to-hero/tools/audit/gate.mjs --report tests/eval/fixtures/critical-report.json; then
            echo "::error::gate should have failed on a critical check FAIL"
            exit 1
          fi
          echo "gate correctly blocked the critical defect"

      - name: Gate JSON report round-trips
        run: |
          node null-to-hero/tools/audit/analyze.mjs tests/eval/fixtures/clean-pass.html --out /tmp/sa.json
          node null-to-hero/tools/audit/gate.mjs --report /tmp/sa.json --min-score 85
