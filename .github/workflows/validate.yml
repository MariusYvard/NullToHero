name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build reference index
        run: node tools/build-index.mjs
        continue-on-error: true

      - name: Run reference validator
        if: always()
        run: node tests/validate.js
