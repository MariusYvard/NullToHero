<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Loading">
  <style>
    .nth-track { stroke: #dbe1ee; }
    .nth-arc { stroke: #6a5cff; transform-origin: 24px 24px; }
    @media (prefers-reduced-motion: no-preference) {
      .nth-arc { animation: nth-spin 0.9s linear infinite; }
    }
    @keyframes nth-spin { to { transform: rotate(360deg); } }
  </style>
  <circle class="nth-track" cx="24" cy="24" r="18" fill="none" stroke-width="5"/>
  <path class="nth-arc" d="M24 6 a18 18 0 0 1 18 18" fill="none" stroke-width="5" stroke-linecap="round"/>
</svg>
