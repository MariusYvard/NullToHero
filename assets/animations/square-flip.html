<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Square flip</title>
<style>
  :root { --sq: #6a5cff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6fb;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  .flip { width: 40px; height: 40px; border-radius: 6px; background: var(--sq); }
  @media (prefers-reduced-motion: no-preference) {
    .flip { animation: nth-flip 1.2s cubic-bezier(0.6, 0, 0.4, 1) infinite; }
  }
  @keyframes nth-flip {
    0% { transform: perspective(120px) rotateX(0) rotateY(0); }
    50% { transform: perspective(120px) rotateX(180deg) rotateY(0); }
    100% { transform: perspective(120px) rotateX(180deg) rotateY(180deg); }
  }
</style>
</head>
<body>
  <div class="flip" role="status" aria-label="Loading"></div>
</body>
</html>
